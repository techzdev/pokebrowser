<div class="filter-container">
  <div class="filter-header">
    <h2>🔍 Filter Pokémon</h2>
    <button 
      *ngIf="hasActiveFilters()" 
      class="clear-btn" 
      (click)="clearFilters()">
      Clear All
    </button>
  </div>

  <!-- Keyword Search -->
  <div class="filter-section">
    <label for="keyword-search">Search by Name or ID</label>
    <input 
      id="keyword-search"
      type="text" 
      [(ngModel)]="keyword" 
      (ngModelChange)="onKeywordChange()"
      placeholder="e.g., Pikachu, 25"
      class="search-input">
  </div>

  <!-- Type Filter -->
  <div class="filter-section">
    <label>Filter by Type</label>
    <div class="type-grid">
      <button
        *ngFor="let type of pokemonTypes"
        class="type-badge"
        [class.selected]="isTypeSelected(type)"
        [style.background-color]="isTypeSelected(type) ? getTypeColor(type) : 'transparent'"
        [style.border-color]="getTypeColor(type)"
        [style.color]="isTypeSelected(type) ? '#fff' : getTypeColor(type)"
        (click)="toggleType(type)">
        {{ type | titlecase }}
      </button>
    </div>
  </div>

  <!-- Generation Filter -->
  <div class="filter-section">
    <label for="generation-select">Filter by Generation</label>
    <select 
      id="generation-select"
      [(ngModel)]="selectedGeneration" 
      (ngModelChange)="onGenerationChange()"
      class="generation-select">
      <option *ngFor="let gen of generations" [value]="gen.value">
        {{ gen.label }}
      </option>
    </select>
  </div>
</div>
