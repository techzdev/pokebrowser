<div class="grid-container">
  <header class="header">
    <h1>Pokémon</h1>
  </header>

  @if (loading() && pokemonList().length === 0) {
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading Pokémon...</p>
    </div>
  } @else {
    <cdk-virtual-scroll-viewport 
      [itemSize]="280" 
      [minBufferPx]="1500"
      [maxBufferPx]="3000"
      class="viewport"
      (scrolledIndexChange)="onScrollIndexChange($event)">
      
      <div class="grid">
        @for (pokemon of pokemonList(); track trackByPokemonId($index, pokemon)) {
          <app-pokemon-card 
            [pokemon]="pokemon"
            [isPriority]="isPriorityItem($index)"
          />
        }
      </div>
    </cdk-virtual-scroll-viewport>
  }
</div>
