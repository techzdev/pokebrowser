<div class="grid-container">
  <header class="header">
    <h1>Pokémon</h1>
  </header>

  @if (loading() && pokemonList().length === 0) {
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading Pokémon...</p>
    </div>
  } @else {
    <div class="grid">
      @for (pokemon of pokemonList(); track trackByPokemonId($index, pokemon)) {
        <app-pokemon-card 
          [pokemon]="pokemon"
          [isPriority]="isPriorityItem($index)"
        />
      }
    </div>
    
    <!-- Load trigger for infinite scroll -->
    <div class="load-trigger" #loadTrigger></div>
  }
</div>
