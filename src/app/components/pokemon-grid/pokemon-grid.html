<div class="pokemon-grid-container">
  <!-- Infinite Workspace Canvas -->
  <div class="infinite-canvas" 
       #canvas
       (mousedown)="onMouseDown($event)"
       (wheel)="onWheel($event)"
       [style.transform]="getTransform()"
       [style.cursor]="isPanning ? 'grabbing' : 'grab'">
    
    <!-- Status Banner (fixed position) -->
    <div class="status-banner-fixed" *ngIf="error">
      <div class="banner-content">
        <span class="banner-icon">⚠️</span>
        <span class="banner-text">{{ error }}</span>
      </div>
    </div>

    <!-- Pokemon Cards positioned at coordinates -->
    <div class="pokemon-workspace">
      <app-pokemon-card 
        *ngFor="let poke of filteredPokemon; trackBy: trackByPokemon; let i = index"
        [pokemon]="poke"
        [index]="getDisplayIndex(i)"
        [style.left.px]="getPokemonX(i)"
        [style.top.px]="getPokemonY(i)"
        class="positioned-card"
        (click)="onPokemonClick(poke.id)">
      </app-pokemon-card>
    </div>

    <!-- Loading spinner -->
    <div class="loading-overlay" *ngIf="loading && pokemon.length === 0">
      <div class="loading-spinner">
        <div class="spinner">
          <div class="pokeball">
            <div class="pokeball-button"></div>
          </div>
        </div>
        <p>Loading Pokémon...</p>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state-overlay" *ngIf="!loading && pokemon.length === 0">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No Pokémon found</h3>
        <p>Unable to load Pokémon data. Please check your connection and try again.</p>
      </div>
    </div>

    <!-- No Results from Filter -->
    <div class="empty-state-overlay" *ngIf="!loading && pokemon.length > 0 && filteredPokemon.length === 0">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No Pokémon match your filters</h3>
        <p>Try adjusting your search criteria</p>
      </div>
    </div>
  </div>

  <!-- Zoom Controls (fixed position) -->
  <div class="zoom-controls">
    <button class="zoom-btn" (click)="zoomIn()" title="Zoom In">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button class="zoom-btn" (click)="resetZoom()" title="Reset View">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
    </button>
    <button class="zoom-btn" (click)="zoomOut()" title="Zoom Out">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Filter Toggle Button (bottom center) -->
  <button class="filter-toggle-btn" (click)="toggleSidebar()" [class.active]="isSidebarOpen">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
    </svg>
    <span class="filter-label">Filter</span>
  </button>

  <!-- Filter Panel Overlay -->
  <div class="sidebar-overlay" 
       *ngIf="isSidebarOpen" 
       (click)="closeSidebar()">
  </div>

  <!-- Filter Panel (bottom) -->
  <aside class="filter-sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
      <h2>🔍 Filter Pokémon</h2>
      <button class="close-sidebar-btn" (click)="closeSidebar()">×</button>
    </div>
    <div class="sidebar-content">
      <app-pokemon-filter 
        (filterChange)="onFilterChange($event)">
      </app-pokemon-filter>
    </div>
  </aside>

  <!-- Detail Modal -->
  <app-pokemon-detail 
    *ngIf="selectedPokemonId"
    [pokemonId]="selectedPokemonId"
    (close)="onCloseDetail()">
  </app-pokemon-detail>
</div>
