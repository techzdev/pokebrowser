<div class="card">
  <div class="card-image">
    <img 
      [ngSrc]="getImageUrl()"
      [alt]="pokemon.name"
      [priority]="isPriority"
      (error)="onImageError()"
      width="220"
      height="220"
    />
  </div>
  <div class="card-info">
    <span class="card-id">#{{ pokemon.id.toString().padStart(3, '0') }}</span>
    <h3 class="card-name">{{ pokemon.name }}</h3>
  </div>
</div>
